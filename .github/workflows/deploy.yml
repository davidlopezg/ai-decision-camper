name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Necesario para que el action pueda pushear a la rama gh-pages
permissions:
  contents: write

# Evita deploys concurrentes que se pisen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Genera web/assets/config.js a partir de los secrets del repo.
      #    SOLO valores NO sensibles (Supabase público, tag de afiliado).
      #    La key del LLM vive en Supabase (Edge Function `llm-proxy`),
      #    nunca toca este archivo.
      - name: Generate config.js from secrets
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AMAZON_TAG:        ${{ secrets.AMAZON_TAG }}
        run: |
          set -euo pipefail
          mkdir -p web/assets
          cat > web/assets/config.js <<'EOF'
          const CONFIG = {
            SUPABASE_URL: '__SUPABASE_URL__',
            SUPABASE_ANON_KEY: '__SUPABASE_ANON_KEY__',
            AMAZON_TAG: '__AMAZON_TAG__',
            SYSTEM_PROMPT_PATH: '../system-prompts/asesor-camper.md',
          };
          EOF
          sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|g"           web/assets/config.js
          sed -i "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|g" web/assets/config.js
          sed -i "s|__AMAZON_TAG__|${AMAZON_TAG}|g"               web/assets/config.js
          # Muestra qué claves se han inyectado (ocultando los valores)
          echo "config.js generado con $(grep -c '=' web/assets/config.js) campos"

      # 2) Publica SOLO el contenido de web/ en la rama gh-pages.
      - name: Deploy web/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: false
          enable_nojekyll: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      # 3) Limpieza: borra config.js del working tree para no commitearlo por accidente.
      - name: Cleanup generated config.js
        if: always()
        run: rm -f web/assets/config.js
